<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Platoon Digital Patrol</title>
  <link rel="manifest" href="manifest.json">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#0a0f1d">
  <link rel="apple-touch-icon" href="logo.png">
  <style>
    :root {
      --bg: #070b14;
      --panel: rgba(15, 23, 42, 0.90);
      --primary: #2563eb;
      --success: #10b981;
      --danger: #ef4444;
      --accent: #f59e0b;
      --text: #f8fafc;
      --muted: #94a3b8;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; user-select: none; }
    body { background-color: var(--bg); color: var(--text); display: flex; flex-direction: column; height: 100vh; overflow: hidden; }
    
    header { background: var(--panel); padding: 12px 18px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid rgba(255,255,255,0.08); backdrop-filter: blur(12px); z-index: 10; }
    header .brand-title { display: flex; align-items: center; gap: 8px; font-size: 1.05rem; font-weight: 800; color: #fff; letter-spacing: 0.3px; }
    header .brand-title span { color: var(--accent); }
    #live-clock { font-size: 0.85rem; color: #cbd5e1; font-weight: 700; font-variant-numeric: tabular-nums; background: rgba(255,255,255,0.06); padding: 4px 10px; border-radius: 8px; border: 1px solid rgba(255,255,255,0.08); }

    main { flex: 1; display: flex; flex-direction: column; align-items: center; padding: 10px; overflow-y: auto; padding-bottom: 105px; }
    
    #viewfinder-wrapper { position: relative; width: 100%; max-width: 460px; aspect-ratio: 3/4; background: #000; border-radius: 18px; overflow: hidden; box-shadow: 0 12px 30px rgba(0,0,0,0.6); border: 1px solid rgba(255,255,255,0.1); }
    video { width: 100%; height: 100%; object-fit: cover; }

    /* Live Recording Indicator */
    #recording-indicator { display: none; position: absolute; top: 14px; left: 14px; background: rgba(239, 68, 68, 0.95); color: white; padding: 6px 14px; border-radius: 20px; font-size: 0.85rem; font-weight: 800; letter-spacing: 0.5px; align-items: center; gap: 8px; box-shadow: 0 4px 14px rgba(239,68,68,0.6); z-index: 5; animation: pulseRed 1s infinite; }
    .rec-dot { width: 10px; height: 10px; border-radius: 50%; background: #fff; }
    @keyframes pulseRed { 0%, 100% { opacity: 1; } 50% { opacity: 0.7; } }

    .status-panel { width: 100%; max-width: 460px; background: var(--panel); margin-top: 10px; padding: 10px 14px; border-radius: 12px; border: 1px solid rgba(255,255,255,0.08); backdrop-filter: blur(8px); }
    #status { font-size: 0.85rem; color: #fbbf24; text-align: left; font-weight: 600; line-height: 1.35; display: flex; align-items: center; gap: 8px; }
    
    #install-banner { display: none; width: 100%; max-width: 460px; background: linear-gradient(135deg, #1e40af, #3b82f6); margin-bottom: 8px; padding: 10px 14px; border-radius: 12px; align-items: center; justify-content: space-between; box-shadow: 0 4px 14px rgba(37, 99, 235, 0.35); }
    #install-banner span { font-size: 0.82rem; font-weight: 700; color: #fff; }
    #install-btn { background: #fff; color: #1e3a8a; border: none; padding: 6px 12px; border-radius: 6px; font-weight: 800; font-size: 0.75rem; cursor: pointer; text-transform: uppercase; }

    /* Controls Action Bar */
    .action-bar { position: fixed; bottom: 0; left: 0; width: 100%; background: rgba(10, 15, 29, 0.94); padding: 12px 18px 20px 18px; border-top: 1px solid rgba(255,255,255,0.1); backdrop-filter: blur(16px); display: flex; flex-direction: column; gap: 10px; align-items: center; z-index: 20; }
    
    .btn-row { display: flex; gap: 10px; width: 100%; max-width: 460px; align-items: center; }
    
    /* Compact circular flip button */
    .btn-flip { width: 48px; height: 48px; border-radius: 50%; background: #1e293b; color: white; border: 1px solid rgba(255,255,255,0.15); display: flex; justify-content: center; align-items: center; font-size: 1.25rem; cursor: pointer; flex-shrink: 0; transition: transform 0.2s, background 0.2s; }
    .btn-flip:active { transform: rotate(180deg) scale(0.92); background: #334155; }
    
    .btn-capture { flex: 1; height: 48px; border-radius: 14px; background: linear-gradient(135deg, #10b981, #059669); color: white; border: none; font-size: 0.95rem; font-weight: 800; cursor: pointer; display: flex; justify-content: center; align-items: center; gap: 8px; box-shadow: 0 4px 16px rgba(16, 185, 129, 0.35); text-transform: uppercase; letter-spacing: 0.3px; }
    .btn-capture:active { transform: scale(0.97); }

    .btn-record { flex: 1; height: 48px; border-radius: 14px; background: linear-gradient(135deg, #ef4444, #dc2626); color: white; border: none; font-size: 0.95rem; font-weight: 800; cursor: pointer; display: flex; justify-content: center; align-items: center; gap: 8px; box-shadow: 0 4px 16px rgba(239, 68, 68, 0.35); text-transform: uppercase; letter-spacing: 0.3px; }
    .btn-record:active { transform: scale(0.97); }

    .btn-stop-rec { width: 100%; height: 50px; border-radius: 14px; background: #ef4444; color: white; border: 2px solid rgba(255,255,255,0.25); font-size: 1rem; font-weight: 800; cursor: pointer; display: flex; justify-content: center; align-items: center; gap: 10px; box-shadow: 0 0 20px rgba(239,68,68,0.6); animation: pulseStop 1.5s infinite; }
    @keyframes pulseStop { 0%, 100% { transform: scale(1); } 50% { transform: scale(0.98); } }

    /* Preview controls: WhatsApp only */
    .btn-action-row { display: none; width: 100%; max-width: 460px; gap: 10px; }
    .btn-retake { flex: 1; height: 50px; background: #334155; color: white; border: 1px solid rgba(255,255,255,0.12); border-radius: 14px; font-weight: 700; font-size: 0.92rem; cursor: pointer; display: flex; justify-content: center; align-items: center; gap: 6px; }
    .btn-whatsapp { flex: 2.2; height: 50px; background: linear-gradient(135deg, #25D366, #128C7E); color: white; border: none; border-radius: 14px; font-weight: 800; font-size: 0.98rem; cursor: pointer; display: flex; justify-content: center; align-items: center; gap: 8px; box-shadow: 0 4px 18px rgba(37, 211, 102, 0.45); text-transform: uppercase; letter-spacing: 0.3px; }
    .btn-whatsapp:active { transform: scale(0.97); }

    #preview-container { width: 100%; max-width: 460px; display: none; }
    canvas { width: 100%; border-radius: 18px; box-shadow: 0 8px 24px rgba(0,0,0,0.6); display: none; }
    #videoPreview { width: 100%; aspect-ratio: 3/4; border-radius: 18px; box-shadow: 0 8px 24px rgba(0,0,0,0.6); object-fit: cover; display: none; background: #000; }
  </style>
</head>
<body>

  <header>
    <div class="brand-title">
      🛡️ <span>Platoon</span> Digital Patrol
    </div>
    <div id="live-clock">--:--:-- IST</div>
  </header>

  <main>
    <div id="install-banner">
      <span>📲 Install App on Phone Home Screen</span>
      <button id="install-btn" onclick="installApp()">Install</button>
    </div>

    <!-- Viewfinder Area -->
    <div id="viewfinder-wrapper">
      <div id="recording-indicator">
        <span class="rec-dot"></span>
        <span id="rec-timer">REC 00:00</span>
      </div>
      <video id="video" autoplay playsinline muted></video>
    </div>

    <div class="status-panel">
      <div id="status">⏳ Connecting to Camera & GPS...</div>
    </div>

    <!-- Preview Container (Photo Canvas or Video Player) -->
    <div id="preview-container">
      <canvas id="canvas"></canvas>
      <video id="videoPreview" controls playsinline></video>
    </div>
  </main>

  <!-- Bottom Actions -->
  <div class="action-bar">
    <!-- Camera Controls -->
    <div class="btn-row" id="cameraControls">
      <button class="btn-flip" id="flipBtn" onclick="toggleCamera()" title="Flip Camera">🔄</button>
      <button class="btn-capture" id="captureBtn" onclick="takeSnapshot()">📸 Photo</button>
      <button class="btn-record" id="recordBtn" onclick="startVideoRecording()">🎥 Video</button>
    </div>

    <!-- Active Recording Controls -->
    <div class="btn-row" id="recordingControls" style="display: none;">
      <button class="btn-stop-rec" onclick="stopVideoRecording()">⏹️ Stop Recording (<span id="stop-timer">00:00</span>)</button>
    </div>

    <!-- Preview Mode Controls: Only Retake and Share to WhatsApp -->
    <div class="btn-action-row" id="previewControls">
      <button class="btn-retake" onclick="resetCamera()">🔄 Retake</button>
      <button class="btn-whatsapp" id="whatsappBtn" onclick="shareToWhatsApp()">🚀 Share WhatsApp</button>
    </div>
  </div>

  <script>
    // Register Service Worker
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('sw.js').then(reg => {
          console.log('ServiceWorker registered successfully.');
        }).catch(err => console.log('ServiceWorker registration failed: ', err));
      });
    }

    let deferredPrompt;
    const installBanner = document.getElementById('install-banner');

    window.addEventListener('beforeinstallprompt', (e) => {
      e.preventDefault();
      deferredPrompt = e;
      installBanner.style.display = 'flex';
    });

    function installApp() {
      if (deferredPrompt) {
        deferredPrompt.prompt();
        deferredPrompt.userChoice.then((choiceResult) => {
          if (choiceResult.outcome === 'accepted') {
            installBanner.style.display = 'none';
          }
          deferredPrompt = null;
        });
      }
    }

    if (window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone === true) {
      installBanner.style.display = 'none';
    }

    // DOM Elements
    const video = document.getElementById('video');
    const canvas = document.getElementById('canvas');
    const videoPreview = document.getElementById('videoPreview');
    const statusText = document.getElementById('status');
    const liveClock = document.getElementById('live-clock');
    const recIndicator = document.getElementById('recording-indicator');
    const recTimer = document.getElementById('rec-timer');
    const stopTimer = document.getElementById('stop-timer');
    
    // GPS & Address State
    let currentLat = "0.000000";
    let currentLon = "0.000000";
    let currentHeadline = "Acquiring Location...";
    let currentSubAddress = "Fetching area details...";
    let currentPincode = "";
    let isGpsLocked = false;
    let addressFetched = false;
    let currentFacingMode = "environment"; 
    let currentStream = null;

    // MediaRecorder State for Smooth Video
    let mediaRecorder = null;
    let recordedChunks = [];
    let recordInterval = null;
    let recordSeconds = 0;
    let recordedVideoBlob = null;
    let recordedVideoMime = "video/mp4";
    let lastCapturedPhotoBlob = null;
    let currentPreviewType = null; // 'photo' or 'video'

    // Logo Image (Kept at top)
    let logoImage = new Image();
    logoImage.crossOrigin = "anonymous";
    logoImage.src = "logo.png";

    // Mini-Map Tile Image for GPS Camera corner stamp
    let mapTileImage = new Image();
    mapTileImage.crossOrigin = "anonymous";
    let mapTileLoaded = false;
    let lastLoadedTileKey = "";

    mapTileImage.onload = () => { mapTileLoaded = true; };
    mapTileImage.onerror = () => { mapTileLoaded = false; };

    // Strict Internet Time Synchronization (Not Phone Time)
    window.exactServerBaseTime = null;
    window.serverSyncMark = null;

    async function syncInternetTime() {
      const endpoints = [
        'https://worldtimeapi.org/api/timezone/Asia/Kolkata',
        'https://timeapi.io/api/time/current/zone?timeZone=Asia/Kolkata'
      ];
      for (let url of endpoints) {
        try {
          let response = await fetch(url, { cache: "no-store" });
          let data = await response.json();
          let serverIso = data.datetime || data.dateTime;
          if (serverIso) {
            window.exactServerBaseTime = new Date(serverIso);
            window.serverSyncMark = Date.now();
            return;
          }
        } catch(e) { /* try next fallback */ }
      }
      if (!window.exactServerBaseTime) {
        window.exactServerBaseTime = new Date();
        window.serverSyncMark = Date.now();
      }
    }
    syncInternetTime();
    setInterval(syncInternetTime, 60000);

    function getExactCurrentTime() {
      if (!window.exactServerBaseTime) return new Date();
      const elapsed = Date.now() - (window.serverSyncMark || Date.now());
      return new Date(window.exactServerBaseTime.getTime() + elapsed);
    }

    // Header Clock
    setInterval(() => {
      const now = getExactCurrentTime();
      const timeStr = now.toLocaleTimeString('en-US', { hour12: false, timeZone: 'Asia/Kolkata' });
      liveClock.innerText = `${timeStr} GMT +05:30`;
    }, 1000);

    // Rounded Rectangle Helper for Canvas
    function drawRoundRect(ctx, x, y, width, height, radius) {
      ctx.beginPath();
      ctx.moveTo(x + radius, y);
      ctx.arcTo(x + width, y, x + width, y + height, radius);
      ctx.arcTo(x + width, y + height, x, y + height, radius);
      ctx.arcTo(x, y + height, x, y, radius);
      ctx.arcTo(x, y + width, y, radius);
      ctx.closePath();
    }

    // Smooth Camera Setup (720p 30fps for zero lag and optimal performance)
    async function startCamera() {
      if (currentStream) currentStream.getTracks().forEach(track => track.stop());
      
      const constraints = {
        video: {
          facingMode: { ideal: currentFacingMode },
          width: { ideal: 1280, max: 1280 },
          height: { ideal: 720, max: 720 },
          frameRate: { ideal: 30, max: 30 }
        },
        audio: {
          echoCancellation: true,
          noiseSuppression: true
        }
      };

      try {
        const stream = await navigator.mediaDevices.getUserMedia(constraints);
        currentStream = stream;
        video.srcObject = stream;
      } catch (err) {
        // Fallback without audio if mic access blocked
        try {
          const streamNoAudio = await navigator.mediaDevices.getUserMedia({
            video: {
              facingMode: { ideal: currentFacingMode },
              width: { ideal: 1280, max: 1280 },
              height: { ideal: 720, max: 720 },
              frameRate: { ideal: 30, max: 30 }
            },
            audio: false
          });
          currentStream = streamNoAudio;
          video.srcObject = streamNoAudio;
        } catch(e) {
          statusText.innerHTML = "❌ <b>Camera Blocked.</b> Please allow camera permissions.";
        }
      }
    }

    function toggleCamera() {
      currentFacingMode = currentFacingMode === "environment" ? "user" : "environment";
      startCamera();
    }

    function resetCamera() {
      document.getElementById('viewfinder-wrapper').style.display = 'block';
      document.getElementById('preview-container').style.display = 'none';
      canvas.style.display = 'none';
      videoPreview.style.display = 'none';
      if (videoPreview.src) {
        videoPreview.pause();
        videoPreview.src = "";
      }
      document.getElementById('cameraControls').style.display = 'flex';
      document.getElementById('recordingControls').style.display = 'none';
      document.getElementById('previewControls').style.display = 'none';
      recIndicator.style.display = 'none';
      
      currentPreviewType = null;
      recordedVideoBlob = null;
      lastCapturedPhotoBlob = null;
      statusText.innerHTML = isGpsLocked ? `🟢 <b>Secured:</b> ${currentHeadline}` : "⏳ <b>Finding Location...</b>";
      startCamera();
    }

    // OpenStreetMap Satellite/Street Tile Calculation
    function updateMapTile(lat, lon) {
      const zoom = 16;
      const latRad = lat * Math.PI / 180;
      const n = Math.pow(2, zoom);
      const x = Math.floor((lon + 180) / 360 * n);
      const y = Math.floor((1 - Math.log(Math.tan(latRad) + 1 / Math.cos(latRad)) / Math.PI) / 2 * n);
      const tileKey = `${zoom}/${x}/${y}`;

      if (tileKey !== lastLoadedTileKey) {
        lastLoadedTileKey = tileKey;
        mapTileLoaded = false;
        mapTileImage.src = `https://tile.openstreetmap.org/${zoom}/${x}/${y}.png`;
      }
    }

    // Geolocation & Granular Landmark Parsing (zoom=18)
    if ("geolocation" in navigator) {
      navigator.geolocation.watchPosition(
        async (pos) => {
          isGpsLocked = true;
          currentLat = pos.coords.latitude.toFixed(6);
          currentLon = pos.coords.longitude.toFixed(6);

          // Update mini-map tile
          updateMapTile(pos.coords.latitude, pos.coords.longitude);

          if (!addressFetched) {
            statusText.innerHTML = `📡 <b>GPS Locked:</b> Fetching precise landmark...`;
            try {
              let response = await fetch(`https://nominatim.openstreetmap.org/reverse?format=json&lat=${currentLat}&lon=${currentLon}&zoom=18&addressdetails=1`);
              let data = await response.json();
              
              if(data && data.address) {
                let specific = data.address.amenity || data.address.hospital || data.address.building || data.address.road || data.address.neighbourhood || "";
                let place = data.address.village || data.address.suburb || data.address.town || data.address.city || data.address.county || "";
                let state = data.address.state || "";
                let country = data.address.country || "India";
                currentPincode = data.address.postcode || "";

                // Headline: e.g. "Tosham Rural, Haryana, India" or "MK Hospital, Bamla, Haryana"
                if (specific && place && specific !== place) {
                  currentHeadline = `${specific}, ${place}`;
                } else if (place && state) {
                  currentHeadline = `${place}, ${state}, ${country}`;
                } else {
                  currentHeadline = place || state || "Patrol Location";
                }

                // Sub-address line: e.g. "Tosham Rural, Haryana 127040, India"
                let subParts = [];
                if (specific && specific !== currentHeadline) subParts.push(specific);
                if (place) subParts.push(place);
                if (state) subParts.push(state + (currentPincode ? ` ${currentPincode}` : ''));
                subParts.push(country);
                currentSubAddress = subParts.join(", ");
                
                if(!currentSubAddress && data.display_name) {
                  currentSubAddress = data.display_name.split(",").slice(0, 3).join(", ");
                }
              }
              addressFetched = true;
            } catch(e) {
              currentHeadline = "Patrol Location Node";
              currentSubAddress = "Unknown Area";
            }
          }
          
          statusText.innerHTML = `🟢 <b>Secured:</b> ${currentHeadline}`;
        },
        (err) => {
          if (err.code === 3) {
            statusText.innerHTML = "⏳ <b>GPS Search:</b> Acquiring satellites (Stay outdoors)...";
          } else {
            statusText.innerHTML = "⚠️ <b>GPS Error:</b> Turn on device Location Services.";
          }
        },
        { enableHighAccuracy: true, timeout: 10000, maximumAge: 0 } 
      );
    }

    // ==========================================
    // PHOTO CAPTURE: HIGH-CONTRAST COMPACT TEMPLATE
    // ==========================================
    function takeSnapshot() {
      if (!isGpsLocked) {
        alert("कृपया GPS लोकेशन आने का इंतज़ार करें (2-3 सेकंड)।\nPlease wait for the GPS location to lock before capturing.");
        return;
      }

      try {
        if (video.videoWidth === 0) return;
        
        currentPreviewType = 'photo';
        document.getElementById('viewfinder-wrapper').style.display = 'none';
        document.getElementById('preview-container').style.display = 'block';
        canvas.style.display = 'block';
        videoPreview.style.display = 'none';
        document.getElementById('cameraControls').style.display = 'none';
        document.getElementById('previewControls').style.display = 'flex';

        canvas.width = video.videoWidth;
        canvas.height = video.videoHeight;
        const ctx = canvas.getContext('2d');
        const cw = canvas.width;
        const ch = canvas.height;

        // 1. Draw camera frame
        ctx.drawImage(video, 0, 0, cw, ch);

        // 2. Logo at Top-Left (Crisp Watermark)
        try {
          if (logoImage.complete && logoImage.naturalWidth > 0) {
            const logoWidth = cw * 0.18; 
            const logoHeight = logoWidth * (logoImage.naturalHeight / logoImage.naturalWidth);
            const logoX = cw * 0.035;
            const logoY = ch * 0.025;
            
            ctx.save();
            ctx.shadowColor = "rgba(0, 0, 0, 0.7)";
            ctx.shadowBlur = 10;
            ctx.drawImage(logoImage, logoX, logoY, logoWidth, logoHeight);
            ctx.restore();
          }
        } catch (e) { console.log("Logo skip"); }

        // 3. Compact Bottom Card Layout (Modeled after reference template)
        const marginX = cw * 0.025;
        const marginY = ch * 0.020;
        
        // Dynamic font sizes proportional to canvas width
        const titleFont = Math.round(cw * 0.040);  // ~20-22px on mobile
        const bodyFont = Math.round(cw * 0.028);   // ~15-16px
        const subFont = Math.round(cw * 0.027);    // ~14-15px
        const lineSpacing = Math.round(cw * 0.008);

        // Calculate card height to tightly wrap 4 lines without dead gaps
        const textBlockHeight = titleFont + bodyFont + subFont + subFont + (lineSpacing * 3);
        const cardPaddingY = Math.round(cw * 0.022);
        const cardHeight = textBlockHeight + (cardPaddingY * 2);
        const cardWidth = cw - (marginX * 2);
        const cardY = ch - cardHeight - marginY;
        const cardRadius = 10;

        // Tinted Dark Slate Container (#2b3342 with 94% opacity)
        ctx.save();
        ctx.fillStyle = "rgba(38, 47, 62, 0.94)";
        drawRoundRect(ctx, marginX, cardY, cardWidth, cardHeight, cardRadius);
        ctx.fill();

        // Subtle clean outer border
        ctx.strokeStyle = "rgba(255, 255, 255, 0.14)";
        ctx.lineWidth = 1.2;
        ctx.stroke();

        // Left Vertical Brand Accent Line (Platoon Gold #f59e0b)
        const stripeWidth = Math.max(4, Math.round(cw * 0.010));
        ctx.fillStyle = "#f59e0b"; // Gold branding
        drawRoundRect(ctx, marginX, cardY, stripeWidth, cardHeight, cardRadius);
        ctx.fill();
        ctx.restore();

        // 4. Square Mini-Map in Left Corner
        const mapSize = cardHeight - (cardPaddingY * 1.5);
        const mapX = marginX + stripeWidth + Math.round(cw * 0.018);
        const mapY = cardY + (cardHeight - mapSize) / 2;
        const mapRadius = 8;

        ctx.save();
        drawRoundRect(ctx, mapX, mapY, mapSize, mapSize, mapRadius);
        ctx.clip();

        if (mapTileLoaded && mapTileImage.complete && mapTileImage.naturalWidth > 0) {
          ctx.drawImage(mapTileImage, mapX, mapY, mapSize, mapSize);
        } else {
          // Tactical dark grid fallback if offline
          ctx.fillStyle = "#111827";
          ctx.fillRect(mapX, mapY, mapSize, mapSize);
          ctx.strokeStyle = "rgba(59, 130, 246, 0.35)";
          ctx.lineWidth = 1;
          for (let gx = mapX; gx <= mapX + mapSize; gx += mapSize / 4) {
            ctx.beginPath(); ctx.moveTo(gx, mapY); ctx.lineTo(gx, mapY + mapSize); ctx.stroke();
          }
          for (let gy = mapY; gy <= mapY + mapSize; gy += mapSize / 4) {
            ctx.beginPath(); ctx.moveTo(mapX, gy); ctx.lineTo(mapX + mapSize, gy); ctx.stroke();
          }
        }

        // Center Location Pin on Mini-Map
        const pinCenterX = mapX + (mapSize / 2);
        const pinCenterY = mapY + (mapSize / 2);
        ctx.font = `${Math.round(mapSize * 0.40)}px Arial, sans-serif`;
        ctx.textAlign = "center";
        ctx.textBaseline = "middle";
        ctx.fillText("📍", pinCenterX, pinCenterY - 2);
        ctx.restore();

        // Mini-Map Border
        ctx.strokeStyle = "rgba(255, 255, 255, 0.25)";
        ctx.lineWidth = 1.2;
        drawRoundRect(ctx, mapX, mapY, mapSize, mapSize, mapRadius);
        ctx.stroke();

        // 5. High-Contrast Text Stack (Fills space tightly without dead gaps)
        const textX = mapX + mapSize + Math.round(cw * 0.024);
        const maxTextWidth = (marginX + cardWidth) - textX - Math.round(cw * 0.020);
        let curY = cardY + cardPaddingY;

        ctx.textAlign = "left";
        ctx.textBaseline = "top";

        // Helper to cleanly truncate with ellipsis
        function fitText(text, maxW) {
          if (ctx.measureText(text).width <= maxW) return text;
          let truncated = text;
          while (ctx.measureText(truncated + "...").width > maxW && truncated.length > 5) {
            truncated = truncated.slice(0, -1);
          }
          return truncated + "...";
        }

        // Line 1: Main Headline Location (Large, Bold, White)
        ctx.font = `bold ${titleFont}px system-ui, -apple-system, sans-serif`;
        ctx.fillStyle = "#ffffff";
        ctx.fillText(fitText(currentHeadline, maxTextWidth), textX, curY);
        curY += titleFont + lineSpacing;

        // Line 2: Indian Flag + Sub-address details
        ctx.font = `normal ${bodyFont}px system-ui, -apple-system, sans-serif`;
        ctx.fillStyle = "#f1f5f9";
        const addrText = `🇮🇳 ${currentSubAddress}`;
        ctx.fillText(fitText(addrText, maxTextWidth), textX, curY);
        curY += bodyFont + lineSpacing;

        // Line 3: Lat & Long Coordinates
        ctx.font = `500 ${subFont}px system-ui, -apple-system, sans-serif`;
        ctx.fillStyle = "#cbd5e1";
        const gpsText = `Lat ${currentLat}°  Long ${currentLon}°`;
        ctx.fillText(fitText(gpsText, maxTextWidth), textX, curY);
        curY += subFont + lineSpacing;

        // Line 4: Strict Internet Time & Date (GMT +05:30)
        const now = getExactCurrentTime();
        const days = ['Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday'];
        const dayName = days[now.getDay()];
        const dayNum = String(now.getDate()).padStart(2, '0');
        const monthNum = String(now.getMonth() + 1).padStart(2, '0');
        const yearNum = now.getFullYear();
        const timeFormatted = now.toLocaleTimeString('en-US', { hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: true, timeZone: 'Asia/Kolkata' });

        ctx.font = `600 ${subFont}px system-ui, -apple-system, sans-serif`;
        ctx.fillStyle = "#ffffff";
        const dateLine = `${dayName}, ${dayNum}/${monthNum}/${yearNum} ${timeFormatted} GMT +05:30`;
        ctx.fillText(fitText(dateLine, maxTextWidth), textX, curY);

        // Convert canvas to Blob for instant sharing
        canvas.toBlob((blob) => {
          lastCapturedPhotoBlob = blob;
        }, 'image/jpeg', 0.95);

        statusText.innerHTML = "✅ <b>Photo Ready:</b> Tap 'Share WhatsApp' below.";
      } catch (err) {
        statusText.innerHTML = "❌ <b>Capture Error.</b> Please press Retake.";
        console.error(err);
      }
    }

    // ==========================================
    // LAG-FREE VIDEO RECORDING (HARDWARE ENCODED)
    // ==========================================
    function getOptimalMimeType() {
      // Prioritize hardware H.264 / MP4 for silky smooth 30fps with 0 lag
      const types = [
        'video/mp4;codecs=avc1.42E01E,mp4a.40.2',
        'video/mp4;codecs=avc1',
        'video/mp4',
        'video/webm;codecs=h264,opus',
        'video/webm;codecs=vp8,opus',
        'video/webm'
      ];
      for (const t of types) {
        if (typeof MediaRecorder !== 'undefined' && MediaRecorder.isTypeSupported(t)) {
          return t;
        }
      }
      return '';
    }

    function startVideoRecording() {
      if (!isGpsLocked) {
        alert("कृपया GPS लोकेशन आने का इंतज़ार करें।\nPlease wait for GPS location before recording video.");
        return;
      }
      if (!currentStream) {
        alert("Camera stream not available.");
        return;
      }

      recordedChunks = [];
      const mime = getOptimalMimeType();
      recordedVideoMime = mime || 'video/mp4';

      const recorderOptions = {
        videoBitsPerSecond: 2500000 // 2.5 Mbps crisp 720p with 0 frame drops
      };
      if (mime) recorderOptions.mimeType = mime;

      try {
        mediaRecorder = new MediaRecorder(currentStream, recorderOptions);
      } catch (e) {
        mediaRecorder = new MediaRecorder(currentStream);
      }

      mediaRecorder.ondataavailable = (event) => {
        if (event.data && event.data.size > 0) {
          recordedChunks.push(event.data);
        }
      };

      mediaRecorder.onstop = () => {
        const finalType = recordedVideoMime.includes('mp4') ? 'video/mp4' : 'video/webm';
        recordedVideoBlob = new Blob(recordedChunks, { type: finalType });
        showVideoPreview(recordedVideoBlob);
      };

      // Start without forced 1s slicing for perfectly smooth continuous recording
      mediaRecorder.start();
      recordSeconds = 0;

      // UI Switch
      document.getElementById('cameraControls').style.display = 'none';
      document.getElementById('recordingControls').style.display = 'flex';
      recIndicator.style.display = 'flex';
      recTimer.innerText = "REC 00:00";
      stopTimer.innerText = "00:00";

      recordInterval = setInterval(() => {
        recordSeconds++;
        const mins = String(Math.floor(recordSeconds / 60)).padStart(2, '0');
        const secs = String(recordSeconds % 60).padStart(2, '0');
        const formatted = `${mins}:${secs}`;
        recTimer.innerText = `REC ${formatted}`;
        stopTimer.innerText = formatted;

        if (recordSeconds >= 60) {
          stopVideoRecording();
        }
      }, 1000);

      statusText.innerHTML = "🔴 <b>Recording Patrol Video...</b> Tap Stop when done.";
    }

    function stopVideoRecording() {
      if (recordInterval) {
        clearInterval(recordInterval);
        recordInterval = null;
      }
      if (mediaRecorder && mediaRecorder.state !== 'inactive') {
        mediaRecorder.stop();
      }
      recIndicator.style.display = 'none';
      document.getElementById('recordingControls').style.display = 'none';
    }

    function showVideoPreview(blob) {
      currentPreviewType = 'video';
      document.getElementById('viewfinder-wrapper').style.display = 'none';
      document.getElementById('preview-container').style.display = 'block';
      canvas.style.display = 'none';
      videoPreview.style.display = 'block';
      videoPreview.src = URL.createObjectURL(blob);
      videoPreview.play();

      document.getElementById('cameraControls').style.display = 'none';
      document.getElementById('previewControls').style.display = 'flex';
      statusText.innerHTML = "✅ <b>Video Ready:</b> Tap 'Share WhatsApp' below.";
    }

    // ==========================================
    // ROBUST WHATSAPP SHARING
    // ==========================================
    async function shareToWhatsApp() {
      const now = getExactCurrentTime();
      const timeStr = now.toLocaleTimeString('en-US', { hour12: false, timeZone: 'Asia/Kolkata' });

      // Clean, well-structured patrol report
      const dutyReport = `*🛡️ Platoon Digital Patrol Report*%0A` +
        `📍 *Location:* ${encodeURIComponent(currentHeadline)}%0A` +
        `🏠 *Area:* ${encodeURIComponent(currentSubAddress)}%0A` +
        `🌐 *GPS:* ${currentLat}° N, ${currentLon}° E%0A` +
        `🕒 *Time:* ${timeStr} GMT +05:30%0A` +
        `✅ *Status:* Official Verified Check-In`;

      try {
        if (currentPreviewType === 'photo') {
          // Prepare JPEG file
          const blob = lastCapturedPhotoBlob || await new Promise(resolve => canvas.toBlob(resolve, 'image/jpeg', 0.95));
          const file = new File([blob], `Platoon_Patrol_${Date.now()}.jpg`, { type: 'image/jpeg' });

          // CRITICAL: On Android WhatsApp, pass ONLY files: [file] without conflicting text
          if (navigator.share && navigator.canShare && navigator.canShare({ files: [file] })) {
            await navigator.share({
              files: [file]
            });
            statusText.innerHTML = "✅ Shared to WhatsApp successfully.";
            return;
          }

          // Fallback if device browser does not support file WebShare:
          downloadBlob(blob, file.name);
          window.location.href = `whatsapp://send?text=${dutyReport}`;
          statusText.innerHTML = "✅ Photo saved! Opening WhatsApp...";

        } else if (currentPreviewType === 'video' && recordedVideoBlob) {
          // Prepare MP4 video file
          const file = new File([recordedVideoBlob], `Platoon_Patrol_${Date.now()}.mp4`, { type: 'video/mp4' });

          if (navigator.share && navigator.canShare && navigator.canShare({ files: [file] })) {
            await navigator.share({
              files: [file]
            });
            statusText.innerHTML = "✅ Video shared to WhatsApp successfully.";
            return;
          }

          // Fallback
          downloadBlob(recordedVideoBlob, file.name);
          window.location.href = `whatsapp://send?text=${dutyReport}`;
          statusText.innerHTML = "✅ Video saved! Opening WhatsApp...";
        }
      } catch (e) {
        if (e.name !== 'AbortError') {
          // If native share threw an error other than user cancel, open WhatsApp directly
          window.open(`https://api.whatsapp.com/send?text=${dutyReport}`, '_blank');
        }
      }
    }

    function downloadBlob(blob, filename) {
      const link = document.createElement('a');
      link.href = URL.createObjectURL(blob);
      link.download = filename;
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);
    }

    // Start camera feed on load
    startCamera();
  </script>
</body>
