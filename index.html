<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Platoon Digital Patrol</title>
  <link rel="manifest" href="manifest.json">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#0a0f1d">
  <link rel="apple-touch-icon" href="logo.png">
  <style>
    :root {
      --bg: #070b14;
      --panel: rgba(15, 23, 42, 0.90);
      --primary: #2563eb;
      --success: #10b981;
      --danger: #ef4444;
      --accent: #f59e0b;
      --text: #f8fafc;
      --muted: #94a3b8;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; user-select: none; }
    
    body {
      background-color: var(--bg);
      color: var(--text);
      display: flex;
      flex-direction: column;
      height: 100vh;
      height: 100dvh;
      overflow: hidden;
    }
    
    header {
      background: var(--panel);
      padding: 10px 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid rgba(255,255,255,0.08);
      backdrop-filter: blur(12px);
      flex-shrink: 0;
      z-index: 10;
    }
    header .brand-title { display: flex; align-items: center; gap: 8px; font-size: 1.05rem; font-weight: 800; color: #fff; letter-spacing: 0.3px; }
    header .brand-title span { color: var(--accent); }
    #live-clock { font-size: 0.82rem; color: #cbd5e1; font-weight: 700; font-variant-numeric: tabular-nums; background: rgba(255,255,255,0.06); padding: 4px 10px; border-radius: 8px; border: 1px solid rgba(255,255,255,0.08); }

    /* Middle Area: Clean flex container that holds the 3:4 frame */
    main {
      flex: 1;
      min-height: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 6px 10px;
      overflow: hidden;
      width: 100%;
      position: relative;
    }
    
    /* Strict 3:4 Viewfinder matching real camera photo proportions */
    #viewfinder-wrapper {
      position: relative;
      width: 100%;
      max-width: 440px;
      aspect-ratio: 3/4;
      flex: 1;
      min-height: 0;
      max-height: 100%;
      background: #000;
      border-radius: 16px;
      overflow: hidden;
      box-shadow: 0 12px 30px rgba(0,0,0,0.6);
      border: 1px solid rgba(255,255,255,0.1);
      display: flex;
      align-items: center;
      justify-content: center;
    }
    video { width: 100%; height: 100%; object-fit: cover; }

    /* Live Recording Indicator */
    #recording-indicator { display: none; position: absolute; top: 12px; left: 12px; background: rgba(239, 68, 68, 0.95); color: white; padding: 5px 12px; border-radius: 20px; font-size: 0.82rem; font-weight: 800; letter-spacing: 0.5px; align-items: center; gap: 8px; box-shadow: 0 4px 14px rgba(239,68,68,0.6); z-index: 5; animation: pulseRed 1s infinite; }
    .rec-dot { width: 9px; height: 9px; border-radius: 50%; background: #fff; }
    @keyframes pulseRed { 0%, 100% { opacity: 1; } 50% { opacity: 0.7; } }

    .status-panel {
      width: 100%;
      max-width: 440px;
      background: var(--panel);
      margin-top: 6px;
      padding: 7px 12px;
      border-radius: 10px;
      border: 1px solid rgba(255,255,255,0.08);
      backdrop-filter: blur(8px);
      flex-shrink: 0;
    }
    #status { font-size: 0.82rem; color: #fbbf24; text-align: left; font-weight: 600; line-height: 1.3; display: flex; align-items: center; gap: 8px; }
    
    #install-banner { display: none; width: 100%; max-width: 440px; background: linear-gradient(135deg, #1e40af, #3b82f6); margin-bottom: 6px; padding: 8px 12px; border-radius: 10px; align-items: center; justify-content: space-between; box-shadow: 0 4px 14px rgba(37, 99, 235, 0.35); flex-shrink: 0; }
    #install-banner span { font-size: 0.80rem; font-weight: 700; color: #fff; }
    #install-btn { background: #fff; color: #1e3a8a; border: none; padding: 5px 10px; border-radius: 6px; font-weight: 800; font-size: 0.72rem; cursor: pointer; text-transform: uppercase; }

    /* PREVIEW CONTAINER: Matches Viewfinder 3:4 Proportions 1:1 */
    #preview-container {
      width: 100%;
      max-width: 440px;
      aspect-ratio: 3/4;
      flex: 1;
      min-height: 0;
      max-height: 100%;
      display: none;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      position: relative;
    }
    canvas {
      width: 100%;
      height: 100%;
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
      border-radius: 16px;
      box-shadow: 0 8px 25px rgba(0,0,0,0.65);
      display: none;
    }
    #videoPreview {
      width: 100%;
      height: 100%;
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
      border-radius: 16px;
      box-shadow: 0 8px 25px rgba(0,0,0,0.65);
      display: none;
      background: #000;
    }

    /* Controls Action Bar */
    .action-bar {
      flex-shrink: 0;
      width: 100%;
      background: rgba(10, 15, 29, 0.94);
      padding: 10px 16px 16px 16px;
      border-top: 1px solid rgba(255,255,255,0.1);
      backdrop-filter: blur(16px);
      display: flex;
      flex-direction: column;
      gap: 8px;
      align-items: center;
      z-index: 20;
    }
    
    .btn-row { display: flex; gap: 10px; width: 100%; max-width: 440px; align-items: center; }
    
    .btn-flip { width: 48px; height: 48px; border-radius: 50%; background: #1e293b; color: white; border: 1px solid rgba(255,255,255,0.15); display: flex; justify-content: center; align-items: center; font-size: 1.25rem; cursor: pointer; flex-shrink: 0; transition: transform 0.2s, background 0.2s; }
    .btn-flip:active { transform: rotate(180deg) scale(0.92); background: #334155; }
    
    .btn-capture { flex: 1; height: 48px; border-radius: 14px; background: linear-gradient(135deg, #10b981, #059669); color: white; border: none; font-size: 0.95rem; font-weight: 800; cursor: pointer; display: flex; justify-content: center; align-items: center; gap: 8px; box-shadow: 0 4px 16px rgba(16, 185, 129, 0.35); text-transform: uppercase; letter-spacing: 0.3px; }
    .btn-capture:active { transform: scale(0.97); }

    .btn-record { flex: 1; height: 48px; border-radius: 14px; background: linear-gradient(135deg, #ef4444, #dc2626); color: white; border: none; font-size: 0.95rem; font-weight: 800; cursor: pointer; display: flex; justify-content: center; align-items: center; gap: 8px; box-shadow: 0 4px 16px rgba(239, 68, 68, 0.35); text-transform: uppercase; letter-spacing: 0.3px; }
    .btn-record:active { transform: scale(0.97); }

    .btn-stop-rec { width: 100%; height: 50px; border-radius: 14px; background: #ef4444; color: white; border: 2px solid rgba(255,255,255,0.25); font-size: 1rem; font-weight: 800; cursor: pointer; display: flex; justify-content: center; align-items: center; gap: 10px; box-shadow: 0 0 20px rgba(239,68,68,0.6); animation: pulseStop 1.5s infinite; }
    @keyframes pulseStop { 0%, 100% { transform: scale(1); } 50% { transform: scale(0.98); } }

    .btn-action-row { display: none; width: 100%; max-width: 440px; gap: 10px; }
    .btn-retake { flex: 1; height: 50px; background: #334155; color: white; border: 1px solid rgba(255,255,255,0.12); border-radius: 14px; font-weight: 700; font-size: 0.92rem; cursor: pointer; display: flex; justify-content: center; align-items: center; gap: 6px; }
    .btn-whatsapp { flex: 2.2; height: 50px; background: linear-gradient(135deg, #25D366, #128C7E); color: white; border: none; border-radius: 14px; font-weight: 800; font-size: 0.98rem; cursor: pointer; display: flex; justify-content: center; align-items: center; gap: 8px; box-shadow: 0 4px 18px rgba(37, 211, 102, 0.45); text-transform: uppercase; letter-spacing: 0.3px; }
    .btn-whatsapp:active { transform: scale(0.97); }
  </style>
</head>
<body>

  <header>
    <div class="brand-title">
      🛡️ <span>Platoon</span> Digital Patrol
    </div>
    <div id="live-clock">--:--:-- GMT +05:30</div>
  </header>

  <main>
    <div id="install-banner">
      <span>📲 Install App on Phone Home Screen</span>
      <button id="install-btn" onclick="installApp()">Install</button>
    </div>

    <!-- Viewfinder Area (3:4 ratio) -->
    <div id="viewfinder-wrapper">
      <div id="recording-indicator">
        <span class="rec-dot"></span>
        <span id="rec-timer">REC 00:00</span>
      </div>
      <video id="video" autoplay playsinline muted></video>
    </div>

    <div class="status-panel" id="statusPanel">
      <div id="status">⏳ Connecting to Camera & GPS...</div>
    </div>

    <!-- Preview Container (Exact 3:4 ratio, zero elongation) -->
    <div id="preview-container">
      <canvas id="canvas"></canvas>
      <video id="videoPreview" controls playsinline></video>
    </div>

    <!-- Hidden Canvas for Real-Time Watermarked Video -->
    <canvas id="recCanvas" style="display: none;"></canvas>
  </main>

  <!-- Bottom Actions -->
  <div class="action-bar">
    <div class="btn-row" id="cameraControls">
      <button class="btn-flip" id="flipBtn" onclick="toggleCamera()" title="Flip Camera">🔄</button>
      <button class="btn-capture" id="captureBtn" onclick="takeSnapshot()">📸 Photo</button>
      <button class="btn-record" id="recordBtn" onclick="startVideoRecording()">🎥 Video</button>
    </div>

    <div class="btn-row" id="recordingControls" style="display: none;">
      <button class="btn-stop-rec" onclick="stopVideoRecording()">⏹️ Stop Recording (<span id="stop-timer">00:00</span>)</button>
    </div>

    <div class="btn-action-row" id="previewControls">
      <button class="btn-retake" onclick="resetCamera()">🔄 Retake</button>
      <button class="btn-whatsapp" id="whatsappBtn" onclick="shareToWhatsApp()">🚀 Share WhatsApp</button>
    </div>
  </div>

  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('sw.js').then(reg => {
          console.log('ServiceWorker registered.');
        }).catch(err => console.log('ServiceWorker registration failed: ', err));
      });
    }

    let deferredPrompt;
    const installBanner = document.getElementById('install-banner');

    window.addEventListener('beforeinstallprompt', (e) => {
      e.preventDefault();
      deferredPrompt = e;
      installBanner.style.display = 'flex';
    });

    function installApp() {
      if (deferredPrompt) {
        deferredPrompt.prompt();
        deferredPrompt.userChoice.then((choiceResult) => {
          if (choiceResult.outcome === 'accepted') {
            installBanner.style.display = 'none';
          }
          deferredPrompt = null;
        });
      }
    }

    if (window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone === true) {
      installBanner.style.display = 'none';
    }

    // DOM Elements
    const video = document.getElementById('video');
    const canvas = document.getElementById('canvas');
    const recCanvas = document.getElementById('recCanvas');
    const videoPreview = document.getElementById('videoPreview');
    const statusText = document.getElementById('status');
    const statusPanel = document.getElementById('statusPanel');
    const liveClock = document.getElementById('live-clock');
    const recIndicator = document.getElementById('recording-indicator');
    const recTimer = document.getElementById('rec-timer');
    const stopTimer = document.getElementById('stop-timer');
    
    // GPS & Address State
    let currentLat = "0.000000";
    let currentLon = "0.000000";
    let currentHeadline = "Acquiring Location...";
    let currentSubAddress = "Fetching area details...";
    let isGpsLocked = false;
    let addressFetched = false;
    let currentFacingMode = "environment"; 
    let currentStream = null;

    // MediaRecorder State
    let mediaRecorder = null;
    let recordedChunks = [];
    let recordInterval = null;
    let recordSeconds = 0;
    let isRecordingActive = false;
    let recordedVideoBlob = null;
    let recordedVideoMime = "video/mp4";
    let lastCapturedPhotoBlob = null;
    let currentPreviewType = null;

    // Logo Image
    let logoImage = new Image();
    logoImage.crossOrigin = "anonymous";
    logoImage.src = "logo.png";

    // Mini-Map Tile
    let mapTileImage = new Image();
    mapTileImage.crossOrigin = "anonymous";
    let mapTileLoaded = false;
    let lastLoadedTileKey = "";

    mapTileImage.onload = () => { mapTileLoaded = true; };
    mapTileImage.onerror = () => { mapTileLoaded = false; };

    // Strict Internet Time Synchronization
    window.exactServerBaseTime = null;
    window.serverSyncMark = null;

    async function syncInternetTime() {
      const endpoints = [
        'https://worldtimeapi.org/api/timezone/Asia/Kolkata',
        'https://timeapi.io/api/time/current/zone?timeZone=Asia/Kolkata'
      ];
      for (let url of endpoints) {
        try {
          let response = await fetch(url, { cache: "no-store" });
          let data = await response.json();
          let serverIso = data.datetime || data.dateTime;
          if (serverIso) {
            window.exactServerBaseTime = new Date(serverIso);
            window.serverSyncMark = Date.now();
            return;
          }
        } catch(e) { /* fallback */ }
      }
      if (!window.exactServerBaseTime) {
        window.exactServerBaseTime = new Date();
        window.serverSyncMark = Date.now();
      }
    }
    syncInternetTime();
    setInterval(syncInternetTime, 60000);

    function getExactCurrentTime() {
      if (!window.exactServerBaseTime) return new Date();
      const elapsed = Date.now() - (window.serverSyncMark || Date.now());
      return new Date(window.exactServerBaseTime.getTime() + elapsed);
    }

    setInterval(() => {
      const now = getExactCurrentTime();
      const timeStr = now.toLocaleTimeString('en-US', { hour12: false, timeZone: 'Asia/Kolkata' });
      liveClock.innerText = `${timeStr} GMT +05:30`;
    }, 1000);

    // Rounded Rectangle Helper
    function drawRoundRect(ctx, x, y, width, height, radius) {
      if (typeof ctx.roundRect === 'function') {
        ctx.beginPath();
        ctx.roundRect(x, y, width, height, radius);
        return;
      }
      ctx.beginPath();
      ctx.moveTo(x + radius, y);
      ctx.lineTo(x + width - radius, y);
      ctx.quadraticCurveTo(x + width, y, x + width, y + radius);
      ctx.lineTo(x + width, y + height - radius);
      ctx.quadraticCurveTo(x + width, y + height, x + width - radius, y + height);
      ctx.lineTo(x + radius, y + height);
      ctx.quadraticCurveTo(x, y + height, x, y + height - radius);
      ctx.lineTo(x, y + radius);
      ctx.quadraticCurveTo(x, y, x + radius, y);
      ctx.closePath();
    }

    // Camera Stream
    async function startCamera() {
      if (currentStream) currentStream.getTracks().forEach(track => track.stop());
      
      const constraints = {
        video: {
          facingMode: { ideal: currentFacingMode },
          aspectRatio: { ideal: 3 / 4 }, // Request 3:4 portrait directly
          width: { ideal: 1280 },
          height: { ideal: 960 }
        },
        audio: true
      };

      try {
        const stream = await navigator.mediaDevices.getUserMedia(constraints);
        currentStream = stream;
        video.srcObject = stream;
      } catch (err) {
        try {
          const streamNoAudio = await navigator.mediaDevices.getUserMedia({
            video: { facingMode: { ideal: currentFacingMode }, aspectRatio: { ideal: 3 / 4 }, width: { ideal: 1280 }, height: { ideal: 960 } },
            audio: false
          });
          currentStream = streamNoAudio;
          video.srcObject = streamNoAudio;
        } catch(e) {
          statusText.innerHTML = "❌ <b>Camera Blocked.</b> Please allow camera permissions.";
        }
      }
    }

    function toggleCamera() {
      currentFacingMode = currentFacingMode === "environment" ? "user" : "environment";
      startCamera();
    }

    function resetCamera() {
      document.getElementById('viewfinder-wrapper').style.display = 'flex';
      statusPanel.style.display = 'block';
      document.getElementById('preview-container').style.display = 'none';
      canvas.style.display = 'none';
      videoPreview.style.display = 'none';
      if (videoPreview.src) {
        videoPreview.pause();
        videoPreview.src = "";
      }
      document.getElementById('cameraControls').style.display = 'flex';
      document.getElementById('recordingControls').style.display = 'none';
      document.getElementById('previewControls').style.display = 'none';
      recIndicator.style.display = 'none';
      
      currentPreviewType = null;
      recordedVideoBlob = null;
      lastCapturedPhotoBlob = null;
      isRecordingActive = false;
      statusText.innerHTML = isGpsLocked ? `🟢 <b>Secured:</b> ${currentHeadline}` : "⏳ <b>Finding Location...</b>";
      startCamera();
    }

    function updateMapTile(lat, lon) {
      const zoom = 16;
      const latRad = lat * Math.PI / 180;
      const n = Math.pow(2, zoom);
      const x = Math.floor((lon + 180) / 360 * n);
      const y = Math.floor((1 - Math.log(Math.tan(latRad) + 1 / Math.cos(latRad)) / Math.PI) / 2 * n);
      const tileKey = `${zoom}/${x}/${y}`;

      if (tileKey !== lastLoadedTileKey) {
        lastLoadedTileKey = tileKey;
        mapTileLoaded = false;
        mapTileImage.src = `https://tile.openstreetmap.org/${zoom}/${x}/${y}.png`;
      }
    }

    // Offline Open Location Code (Plus Code) Generator
    function getPlusCode(lat, lon) {
      try {
        const CODE_ALPHABET = "23456789CFGHJMPQRVWX";
        let cLat = Math.min(Math.max(lat, -90), 90);
        let cLon = ((((lon + 180) % 360) + 360) % 360) - 180;
        if (cLat === 90) cLat -= 0.0000001;

        let latVal = cLat + 90;
        let lonVal = cLon + 180;
        let code = "";
        let latRes = 20.0;
        let lonRes = 20.0;

        for (let i = 0; i < 4; i++) {
          const latDigit = Math.floor(latVal / latRes);
          const lonDigit = Math.floor(lonVal / lonRes);
          latVal -= latDigit * latRes;
          lonVal -= lonDigit * lonRes;
          code += CODE_ALPHABET[latDigit] + CODE_ALPHABET[lonDigit];
          latRes /= 20.0;
          lonRes /= 20.0;
        }
        code += "+";
        for (let i = 0; i < 1; i++) {
          const latDigit = Math.floor(latVal / latRes);
          const lonDigit = Math.floor(lonVal / lonRes);
          latVal -= latDigit * latRes;
          lonVal -= lonDigit * lonRes;
          code += CODE_ALPHABET[latDigit] + CODE_ALPHABET[lonDigit];
          latRes /= 20.0;
          lonRes /= 20.0;
        }
        return code.length >= 8 ? code.substring(4) : code;
      } catch (e) {
        return "";
      }
    }

    let lastFetchedLat = null;
    let lastFetchedLon = null;

    if ("geolocation" in navigator) {
      navigator.geolocation.watchPosition(
        async (pos) => {
          isGpsLocked = true;
          currentLat = pos.coords.latitude.toFixed(6);
          currentLon = pos.coords.longitude.toFixed(6);

          updateMapTile(pos.coords.latitude, pos.coords.longitude);

          const distanceMoved = (lastFetchedLat !== null && lastFetchedLon !== null) 
            ? Math.hypot(pos.coords.latitude - lastFetchedLat, pos.coords.longitude - lastFetchedLon)
            : 1;

          if (!addressFetched || distanceMoved > 0.0004) {
            lastFetchedLat = pos.coords.latitude;
            lastFetchedLon = pos.coords.longitude;
            statusText.innerHTML = `📡 <b>GPS Locked:</b> Resolving precise landmark...`;
            try {
              let response = await fetch(`https://nominatim.openstreetmap.org/reverse?format=json&lat=${currentLat}&lon=${currentLon}&zoom=18&addressdetails=1&extratags=1&namedetails=1`);
              let data = await response.json();
              
              if (data && data.address) {
                const a = data.address;
                
                // Building, amenity, landmark, medical, education, commerce, or government tags
                const building = data.name || a.amenity || a.hospital || a.clinic || a.healthcare || 
                                 a.building || a.school || a.college || a.university || a.police || 
                                 a.shop || a.office || a.place_of_worship || a.temple || a.mosque || 
                                 a.bank || a.commercial || a.government || a.emergency || a.residential || "";

                // Road, street, highway, or pedestrian lane
                const road = a.road || a.street || a.highway || a.pedestrian || a.footway || a.path || "";

                // Locality, suburb, neighborhood, or sector
                const locality = a.neighbourhood || a.suburb || a.subdistrict || a.quarter || a.hamlet || a.village_block || "";

                // Village, town, or city
                const place = a.village || a.town || a.city || a.municipality || a.city_district || "";

                // Tehsil or District
                const tehsil = a.county || "";
                const district = a.state_district || (tehsil && tehsil !== place ? tehsil : "");

                // State, Postal Code, Country
                const state = a.state || "Haryana";
                const pincode = a.postcode || "";
                const country = a.country || "India";

                // Plus Code (Open Location Code)
                const plusCode = getPlusCode(pos.coords.latitude, pos.coords.longitude);

                // Construct Headline: Prioritize Building > Road > Locality > Place
                if (building && place && building.toLowerCase() !== place.toLowerCase()) {
                  currentHeadline = `${building}, ${place}`;
                } else if (building) {
                  currentHeadline = `${building}, ${district || state}`;
                } else if (road && place) {
                  currentHeadline = `${road}, ${place}`;
                } else if (locality && place) {
                  currentHeadline = `${locality}, ${place}`;
                } else if (place && district && place.toLowerCase() !== district.toLowerCase()) {
                  currentHeadline = `${place}, ${district}, ${state}`;
                } else if (place) {
                  currentHeadline = `${place}, ${state}, ${country}`;
                } else {
                  currentHeadline = `${state}, ${country}`;
                }

                // Construct Rich Hierarchical Sub-Address
                let parts = [];
                if (plusCode) parts.push(plusCode);
                if (building && !currentHeadline.startsWith(building)) parts.push(building);
                if (road) parts.push(road);
                if (locality && locality !== place && locality !== building) parts.push(locality);
                if (place) parts.push(place);
                if (district && district !== place && district !== tehsil) parts.push(district);
                if (state) parts.push(state + (pincode ? ` ${pincode}` : ''));
                parts.push(country);

                // Deduplicate parts
                let cleanParts = [];
                for (let p of parts) {
                  if (p && !cleanParts.some(cp => cp.trim().toLowerCase() === p.trim().toLowerCase())) {
                    cleanParts.push(p.trim());
                  }
                }
                currentSubAddress = cleanParts.join(", ");

                if (!currentSubAddress && data.display_name) {
                  currentSubAddress = data.display_name.split(",").slice(0, 4).join(", ");
                }
              }
              addressFetched = true;
            } catch(e) {
              if (!currentHeadline) currentHeadline = "Patrol Security Node";
              if (!currentSubAddress) currentSubAddress = "Field Location";
            }
          }
          
          statusText.innerHTML = `🟢 <b>Secured:</b> ${currentHeadline}`;
        },
        (err) => {
          if (err.code === 3) {
            statusText.innerHTML = "⏳ <b>GPS Search:</b> Acquiring satellites (Stay outdoors)...";
          } else {
            statusText.innerHTML = "⚠️ <b>GPS Error:</b> Turn on device Location Services.";
          }
        },
        { enableHighAccuracy: true, timeout: 10000, maximumAge: 0 } 
      );
    }

    // =========================================================
    // UNIFIED WATERMARK RENDERER (TOP LOGO + DUAL BOTTOM CARDS)
    // =========================================================
    function drawWatermarkTemplate(ctx, cw, ch) {
      // 1. Transparent Company Logo at Top-Left (Subtle drop shadow)
      try {
        if (logoImage.complete && logoImage.naturalWidth > 0) {
          const logoWidth = Math.round(cw * 0.18); 
          const logoHeight = Math.round(logoWidth * (logoImage.naturalHeight / logoImage.naturalWidth));
          const logoX = Math.round(cw * 0.035);
          const logoY = Math.round(ch * 0.025);
          
          ctx.save();
          ctx.shadowColor = "rgba(0, 0, 0, 0.75)";
          ctx.shadowBlur = 10;
          ctx.drawImage(logoImage, logoX, logoY, logoWidth, logoHeight);
          ctx.restore();
        }
      } catch (e) { /* skip */ }

      // 2. Geometry: Map Card (Left) & Separated Location Box (Right)
      const marginX = Math.round(cw * 0.030);
      const marginY = Math.round(ch * 0.024);
      const gap = Math.round(cw * 0.022); // VISIBLE SEPARATION GAP

      const cardHeight = Math.round(ch * 0.170); // ~163px on 960h, ~245px on 1440h
      const cardY = ch - cardHeight - marginY;
      const cornerRadius = Math.round(cardHeight * 0.09);

      // =========================================================
      // CARD A: Square Mini-Map Tile (Left)
      // =========================================================
      const mapSize = cardHeight; // Perfect 1:1 square
      const mapX = marginX;
      const mapY = cardY;

      // Card A Shadow & Background
      ctx.save();
      ctx.shadowColor = "rgba(0, 0, 0, 0.55)";
      ctx.shadowBlur = 12;
      ctx.shadowOffsetY = 4;
      drawRoundRect(ctx, mapX, mapY, mapSize, mapSize, cornerRadius);
      ctx.fillStyle = "#111827";
      ctx.fill();
      ctx.restore();

      // Clip map tile to rounded corners
      ctx.save();
      drawRoundRect(ctx, mapX, mapY, mapSize, mapSize, cornerRadius);
      ctx.clip();

      if (mapTileLoaded && mapTileImage.complete && mapTileImage.naturalWidth > 0) {
        try {
          ctx.drawImage(mapTileImage, mapX, mapY, mapSize, mapSize);
        } catch(e) {
          drawFallbackGrid(ctx, mapX, mapY, mapSize);
        }
      } else {
        drawFallbackGrid(ctx, mapX, mapY, mapSize);
      }

      // Center Location Pin on Mini-Map
      const pinCenterX = mapX + (mapSize / 2);
      const pinCenterY = mapY + (mapSize / 2);
      ctx.font = `${Math.round(mapSize * 0.38)}px Arial, sans-serif`;
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";
      ctx.shadowColor = "rgba(0, 0, 0, 0.7)";
      ctx.shadowBlur = 6;
      ctx.fillText("📍", pinCenterX, pinCenterY - 2);
      ctx.restore();

      // Left Vertical Brand Accent Stripe on Map Card (Platoon Gold #f59e0b)
      const stripeWidth = Math.max(5, Math.round(cw * 0.012));
      ctx.save();
      drawRoundRect(ctx, mapX, mapY, mapSize, mapSize, cornerRadius);
      ctx.clip();
      ctx.fillStyle = "#f59e0b";
      ctx.fillRect(mapX, mapY, stripeWidth, mapSize);
      ctx.restore();

      // Map Card Border
      ctx.save();
      ctx.strokeStyle = "rgba(255, 255, 255, 0.22)";
      ctx.lineWidth = 1.2;
      drawRoundRect(ctx, mapX, mapY, mapSize, mapSize, cornerRadius);
      ctx.stroke();
      ctx.restore();

      // =========================================================
      // CARD B: Separated Location & Metadata Card (Right)
      // =========================================================
      const textCardX = mapX + mapSize + gap;
      const textCardWidth = (cw - marginX) - textCardX;
      const textCardY = cardY;
      const textCardHeight = cardHeight;

      // Card B Shadow & Background (Tinted Slate Glass)
      ctx.save();
      ctx.shadowColor = "rgba(0, 0, 0, 0.55)";
      ctx.shadowBlur = 12;
      ctx.shadowOffsetY = 4;
      drawRoundRect(ctx, textCardX, textCardY, textCardWidth, textCardHeight, cornerRadius);
      ctx.fillStyle = "rgba(26, 34, 48, 0.94)";
      ctx.fill();
      ctx.restore();

      // Card B Border
      ctx.save();
      ctx.strokeStyle = "rgba(255, 255, 255, 0.16)";
      ctx.lineWidth = 1.2;
      drawRoundRect(ctx, textCardX, textCardY, textCardWidth, textCardHeight, cornerRadius);
      ctx.stroke();
      ctx.restore();

      // Inner Padding & Text Space
      const padX = Math.round(textCardWidth * 0.042);
      const padY = Math.round(textCardHeight * 0.08);
      const innerW = textCardWidth - (padX * 2);
      const innerH = textCardHeight - (padY * 2);
      const startX = textCardX + padX;

      // Dynamic Font Scaling
      let brandFont = Math.max(10, Math.round(innerH * 0.095));
      let titleFont = Math.max(14, Math.round(innerH * 0.145));
      let bodyFont  = Math.max(11, Math.round(innerH * 0.115));
      let coordFont = Math.max(10, Math.round(innerH * 0.105));
      let timeFont  = Math.max(10, Math.round(innerH * 0.105));

      function fitText(text, maxW, fontSpec) {
        if (!text) return "";
        ctx.font = fontSpec;
        if (ctx.measureText(text).width <= maxW) return text;
        let str = String(text);
        while (ctx.measureText(str + "...").width > maxW && str.length > 3) {
          str = str.slice(0, -1);
        }
        return str + "...";
      }

      // Dynamically shrink title font if headline is long
      ctx.font = `bold ${titleFont}px system-ui, -apple-system, sans-serif`;
      while (ctx.measureText(currentHeadline).width > innerW && titleFont > 12) {
        titleFont -= 1;
        ctx.font = `bold ${titleFont}px system-ui, -apple-system, sans-serif`;
      }

      // Vertical Rhythm: distribute vertical space evenly across 5 lines
      const totalFontH = brandFont + titleFont + bodyFont + coordFont + timeFont;
      const vGap = Math.max(3, Math.floor((innerH - totalFontH) / 4));

      let curY = textCardY + padY;
      ctx.textAlign = "left";
      ctx.textBaseline = "top";

      // Line 1: Brand & Status Header
      ctx.font = `bold ${brandFont}px system-ui, -apple-system, sans-serif`;
      ctx.fillStyle = "#f59e0b";
      ctx.fillText("🛡️ PLATOON DIGITAL PATROL", startX, curY);

      ctx.font = `600 ${Math.max(9, brandFont - 1)}px system-ui, -apple-system, sans-serif`;
      ctx.fillStyle = "#34d399";
      ctx.textAlign = "right";
      ctx.fillText("● VERIFIED GPS", textCardX + textCardWidth - padX, curY);
      ctx.textAlign = "left";
      curY += brandFont + vGap;

      // Line 2: Main Headline Location (Building / Street / Town)
      ctx.font = `bold ${titleFont}px system-ui, -apple-system, sans-serif`;
      ctx.fillStyle = "#ffffff";
      ctx.fillText(fitText(currentHeadline, innerW, ctx.font), startX, curY);
      curY += titleFont + vGap;

      // Line 3: 🇮🇳 Detailed Full Address with Plus Code, Street, Locality & Pincode
      ctx.font = `normal ${bodyFont}px system-ui, -apple-system, sans-serif`;
      ctx.fillStyle = "#f1f5f9";
      ctx.fillText(fitText(`🇮🇳 ${currentSubAddress}`, innerW, ctx.font), startX, curY);
      curY += bodyFont + vGap;

      // Line 4: Precise GPS Coordinates
      ctx.font = `500 ${coordFont}px system-ui, -apple-system, sans-serif`;
      ctx.fillStyle = "#94a3b8";
      ctx.fillText(fitText(`Lat ${currentLat}°   Long ${currentLon}°`, innerW, ctx.font), startX, curY);
      curY += coordFont + vGap;

      // Line 5: Strict Internet Timestamp (GMT +05:30)
      const now = getExactCurrentTime();
      const days = ['Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday'];
      const dayName = days[now.getDay()];
      const dayNum = String(now.getDate()).padStart(2, '0');
      const monthNum = String(now.getMonth() + 1).padStart(2, '0');
      const yearNum = now.getFullYear();
      const timeFormatted = now.toLocaleTimeString('en-US', { hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: true, timeZone: 'Asia/Kolkata' });

      ctx.font = `600 ${timeFont}px system-ui, -apple-system, sans-serif`;
      ctx.fillStyle = "#ffffff";
      const dateLine = `${dayName}, ${dayNum}/${monthNum}/${yearNum} ${timeFormatted} GMT +05:30`;
      ctx.fillText(fitText(dateLine, innerW, ctx.font), startX, curY);
    }

    function drawFallbackGrid(ctx, x, y, size) {
      ctx.fillStyle = "#111827";
      ctx.fillRect(x, y, size, size);
      ctx.strokeStyle = "rgba(59, 130, 246, 0.35)";
      ctx.lineWidth = 1;
      for (let gx = x; gx <= x + size; gx += size / 4) {
        ctx.beginPath(); ctx.moveTo(gx, y); ctx.lineTo(gx, y + size); ctx.stroke();
      }
      for (let gy = y; gy <= y + size; gy += size / 4) {
        ctx.beginPath(); ctx.moveTo(x, gy); ctx.lineTo(x + size, gy); ctx.stroke();
      }
    }

    // =========================================================================
    // PHOTO CAPTURE: EXACT 3:4 CROPPING (ELIMINATES ELONGATION & STRETCHING)
    // =========================================================================
    function takeSnapshot() {
      if (!isGpsLocked) {
        alert("कृपया GPS लोकेशन आने का इंतज़ार करें (2-3 सेकंड)।\nPlease wait for the GPS location to lock before capturing.");
        return;
      }

      try {
        const vw = video.videoWidth;
        const vh = video.videoHeight;
        if (!vw || !vh) return;
        
        currentPreviewType = 'photo';
        
        // Switch UI to preview mode
        document.getElementById('viewfinder-wrapper').style.display = 'none';
        statusPanel.style.display = 'none';
        document.getElementById('preview-container').style.display = 'flex';
        canvas.style.display = 'block';
        videoPreview.style.display = 'none';
        document.getElementById('cameraControls').style.display = 'none';
        document.getElementById('previewControls').style.display = 'flex';

        // Calculate exact 3:4 crop matching the viewfinder's object-fit: cover
        const targetRatio = 3 / 4;
        const srcRatio = vw / vh;
        let sx, sy, sWidth, sHeight;

        if (srcRatio > targetRatio) {
          sHeight = vh;
          sWidth = Math.round(vh * targetRatio);
          sx = Math.round((vw - sWidth) / 2);
          sy = 0;
        } else {
          sWidth = vw;
          sHeight = Math.round(vw / targetRatio);
          sx = 0;
          sy = Math.round((vh - sHeight) / 2);
        }

        // Set canvas to high-res 3:4 (e.g. 720x960 or 1080x1440)
        const cw = Math.min(1080, sWidth);
        const ch = Math.round(cw / targetRatio);

        canvas.width = cw;
        canvas.height = ch;
        const ctx = canvas.getContext('2d');

        // Draw cropped 3:4 camera frame — 100% true to viewfinder framing, zero elongation!
        ctx.drawImage(video, sx, sy, sWidth, sHeight, 0, 0, cw, ch);

        // Draw unified watermark
        drawWatermarkTemplate(ctx, cw, ch);

        // Convert to Blob for instant sharing
        canvas.toBlob((blob) => {
          lastCapturedPhotoBlob = blob;
        }, 'image/jpeg', 0.95);

        statusText.innerHTML = "✅ <b>Photo Ready:</b> Tap 'Share WhatsApp' below.";
      } catch (err) {
        statusText.innerHTML = "❌ <b>Capture Error.</b> Please press Retake.";
        console.error("takeSnapshot Error:", err);
      }
    }

    // ================================================================
    // REAL-TIME WATERMARKED VIDEO RECORDING (3:4 PROPORTIONS + AUDIO)
    // ================================================================
    function getOptimalMimeType() {
      const types = [
        'video/mp4;codecs=avc1.42E01E,mp4a.40.2',
        'video/mp4;codecs=avc1',
        'video/mp4',
        'video/webm;codecs=h264,opus',
        'video/webm;codecs=vp8,opus',
        'video/webm'
      ];
      for (const t of types) {
        if (typeof MediaRecorder !== 'undefined' && MediaRecorder.isTypeSupported(t)) {
          return t;
        }
      }
      return '';
    }

    function startVideoRecording() {
      if (!isGpsLocked) {
        alert("कृपया GPS लोकेशन आने का इंतज़ार करें।\nPlease wait for GPS location before recording video.");
        return;
      }
      if (!currentStream) {
        alert("Camera stream not available.");
        return;
      }

      recordedChunks = [];
      const vw = video.videoWidth || 720;
      const vh = video.videoHeight || 960;
      const targetRatio = 3 / 4;
      const srcRatio = vw / vh;

      let sx, sy, sWidth, sHeight;
      if (srcRatio > targetRatio) {
        sHeight = vh;
        sWidth = Math.round(vh * targetRatio);
        sx = Math.round((vw - sWidth) / 2);
        sy = 0;
      } else {
        sWidth = vw;
        sHeight = Math.round(vw / targetRatio);
        sx = 0;
        sy = Math.round((vh - sHeight) / 2);
      }

      const rw = 720;
      const rh = Math.round(rw / targetRatio); // 960 (3:4)
      recCanvas.width = rw;
      recCanvas.height = rh;
      const recCtx = recCanvas.getContext('2d');

      isRecordingActive = true;

      // Real-time canvas rendering loop matching 3:4 viewfinder
      function renderRecordingFrame() {
        if (!isRecordingActive) return;
        recCtx.drawImage(video, sx, sy, sWidth, sHeight, 0, 0, rw, rh);
        drawWatermarkTemplate(recCtx, rw, rh);
        requestAnimationFrame(renderRecordingFrame);
      }
      renderRecordingFrame();

      let streamToRecord = currentStream;
      if (typeof recCanvas.captureStream === 'function') {
        try {
          const canvasStream = recCanvas.captureStream(30);
          const audioTracks = currentStream.getAudioTracks();
          if (audioTracks.length > 0) {
            streamToRecord = new MediaStream([canvasStream.getVideoTracks()[0], audioTracks[0]]);
          } else {
            streamToRecord = canvasStream;
          }
        } catch (e) {
          streamToRecord = currentStream;
        }
      }

      const mime = getOptimalMimeType();
      recordedVideoMime = mime || 'video/mp4';

      const recorderOptions = {
        videoBitsPerSecond: 2500000
      };
      if (mime) recorderOptions.mimeType = mime;

      try {
        mediaRecorder = new MediaRecorder(streamToRecord, recorderOptions);
      } catch (e) {
        mediaRecorder = new MediaRecorder(streamToRecord);
      }

      mediaRecorder.ondataavailable = (event) => {
        if (event.data && event.data.size > 0) {
          recordedChunks.push(event.data);
        }
      };

      mediaRecorder.onstop = () => {
        isRecordingActive = false;
        const finalType = recordedVideoMime.includes('mp4') ? 'video/mp4' : 'video/webm';
        recordedVideoBlob = new Blob(recordedChunks, { type: finalType });
        showVideoPreview(recordedVideoBlob);
      };

      mediaRecorder.start();
      recordSeconds = 0;

      document.getElementById('cameraControls').style.display = 'none';
      document.getElementById('recordingControls').style.display = 'flex';
      recIndicator.style.display = 'flex';
      recTimer.innerText = "REC 00:00";
      stopTimer.innerText = "00:00";

      recordInterval = setInterval(() => {
        recordSeconds++;
        const mins = String(Math.floor(recordSeconds / 60)).padStart(2, '0');
        const secs = String(recordSeconds % 60).padStart(2, '0');
        const formatted = `${mins}:${secs}`;
        recTimer.innerText = `REC ${formatted}`;
        stopTimer.innerText = formatted;

        if (recordSeconds >= 60) {
          stopVideoRecording();
        }
      }, 1000);

      statusText.innerHTML = "🔴 <b>Recording Patrol Video...</b> Tap Stop when done.";
    }

    function stopVideoRecording() {
      isRecordingActive = false;
      if (recordInterval) {
        clearInterval(recordInterval);
        recordInterval = null;
      }
      if (mediaRecorder && mediaRecorder.state !== 'inactive') {
        mediaRecorder.stop();
      }
      recIndicator.style.display = 'none';
      document.getElementById('recordingControls').style.display = 'none';
    }

    function showVideoPreview(blob) {
      currentPreviewType = 'video';
      
      document.getElementById('viewfinder-wrapper').style.display = 'none';
      statusPanel.style.display = 'none';
      document.getElementById('preview-container').style.display = 'flex';
      canvas.style.display = 'none';
      videoPreview.style.display = 'block';
      videoPreview.src = URL.createObjectURL(blob);
      videoPreview.play();

      document.getElementById('cameraControls').style.display = 'none';
      document.getElementById('previewControls').style.display = 'flex';
      statusText.innerHTML = "✅ <b>Video Ready:</b> Tap 'Share WhatsApp' below.";
    }

    // ==========================================
    // DIRECT WHATSAPP SHARING
    // ==========================================
    async function shareToWhatsApp() {
      const now = getExactCurrentTime();
      const timeStr = now.toLocaleTimeString('en-US', { hour12: false, timeZone: 'Asia/Kolkata' });

      const dutyReport = `*🛡️ Platoon Digital Patrol Report*%0A` +
        `📍 *Location:* ${encodeURIComponent(currentHeadline)}%0A` +
        `🏠 *Area:* ${encodeURIComponent(currentSubAddress)}%0A` +
        `🌐 *GPS:* ${currentLat}° N, ${currentLon}° E%0A` +
        `🕒 *Time:* ${timeStr} GMT +05:30%0A` +
        `✅ *Status:* Official Verified Check-In`;

      try {
        if (currentPreviewType === 'photo') {
          const blob = lastCapturedPhotoBlob || await new Promise(resolve => canvas.toBlob(resolve, 'image/jpeg', 0.95));
          const file = new File([blob], `Platoon_Patrol_${Date.now()}.jpg`, { type: 'image/jpeg' });

          if (navigator.share && navigator.canShare && navigator.canShare({ files: [file] })) {
            await navigator.share({
              files: [file]
            });
            statusText.innerHTML = "✅ Shared to WhatsApp successfully.";
            return;
          }

          downloadBlob(blob, file.name);
          window.location.href = `whatsapp://send?text=${dutyReport}`;
          statusText.innerHTML = "✅ Photo saved! Opening WhatsApp...";

        } else if (currentPreviewType === 'video' && recordedVideoBlob) {
          const ext = recordedVideoBlob.type.includes('mp4') ? 'mp4' : 'webm';
          const file = new File([recordedVideoBlob], `Platoon_Patrol_${Date.now()}.${ext}`, { type: recordedVideoBlob.type });

          if (navigator.share && navigator.canShare && navigator.canShare({ files: [file] })) {
            await navigator.share({
              files: [file]
            });
            statusText.innerHTML = "✅ Video shared to WhatsApp successfully.";
            return;
          }

          downloadBlob(recordedVideoBlob, file.name);
          window.location.href = `whatsapp://send?text=${dutyReport}`;
          statusText.innerHTML = "✅ Video saved! Opening WhatsApp...";
        }
      } catch (e) {
        if (e.name !== 'AbortError') {
          window.open(`https://api.whatsapp.com/send?text=${dutyReport}`, '_blank');
        }
      }
    }

    function downloadBlob(blob, filename) {
      const link = document.createElement('a');
      link.href = URL.createObjectURL(blob);
      link.download = filename;
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);
    }

    // Start camera feed on load
    startCamera();
  </script>
